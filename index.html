<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumping Animals</title>

    <!-- Tipografía redonda y amigable (si no carga, usa la del sistema) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #ffd54f; --gold-dark: #b8860b; }

        body { margin: 0; overflow: hidden; font-family: 'Fredoka', system-ui, sans-serif; }
        .hidden { display: none !important; }

        /* ---------- Pantallas (menú y Game over) ---------- */
        .screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 22px;
            padding: 20px; box-sizing: border-box;
            color: white; text-align: center;
            background: radial-gradient(circle at 50% 40%, rgba(20, 45, 30, 0.55), rgba(0, 0, 0, 0.82));
            backdrop-filter: blur(4px);           /* difumina el juego que se ve detrás */
            animation: fade-in 0.4s ease;
        }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        .title {
            margin: 0; color: var(--gold);
            font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: 1;
            text-shadow: 0 4px 0 var(--gold-dark), 0 10px 22px rgba(0, 0, 0, 0.55);
        }
        .subtitle { margin: 0; font-size: 1.2rem; opacity: 0.85; }
        .hint { margin: 6px 0 0; font-size: 0.95rem; opacity: 0.7; }

        /* ---------- Tarjetas de nivel ---------- */
        .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
        .card {
            width: 230px; padding: 22px 16px;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            font-family: inherit; color: white; cursor: pointer;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.28); border-radius: 22px;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.03);
            background: rgba(255, 213, 79, 0.22); border-color: var(--gold);
        }
        .card:active { transform: scale(0.98); }
        .card .icon { font-size: 3.2rem; }
        .card .name { font-size: 1.35rem; font-weight: 700; color: var(--gold); }
        .card .desc { font-size: 0.98rem; opacity: 0.9; }
        .card .record {
            margin-top: 8px; padding: 4px 14px;
            font-size: 0.98rem; font-weight: 600;
            background: rgba(0, 0, 0, 0.3); border-radius: 999px;
        }
        .card .record b { color: var(--gold); }

        /* ---------- Controles (menú) ---------- */
        .controls {
            display: flex; flex-direction: column; gap: 12px;
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 18px;
        }
        .controls h2 { margin: 0; font-size: 1.05rem; color: var(--gold); letter-spacing: 0.05em; }
        .control-row {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
            gap: 8px 10px; font-size: 0.98rem;
        }
        .keys { display: inline-flex; gap: 4px; }
        kbd {
            min-width: 28px; padding: 4px 9px;
            font: inherit; font-weight: 700; color: #2b2b2b;
            background: #f5f5f5; border-radius: 8px;
            box-shadow: 0 3px 0 #9e9e9e;
        }
        .or { opacity: 0.7; }
        .label { opacity: 0.9; }

        /* ---------- Botones (Game over) ---------- */
        .btn {
            min-width: 220px; padding: 12px 28px;
            font-family: inherit; font-size: 1.15rem; font-weight: 700; color: #2b2b2b;
            background: var(--gold); border: 0; border-radius: 999px; cursor: pointer;
            box-shadow: 0 4px 0 var(--gold-dark);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
        .btn.secondary { background: rgba(255, 255, 255, 0.85); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); }

        /* ---------- Game over ---------- */
        .panel {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 30px 44px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 26px;
        }
        #finalScore { margin: 0; font-size: 1.7rem; font-weight: 600; }
        #recordMsg { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; }
        #recordMsg.record { color: var(--gold); animation: pulse 0.9s ease-in-out infinite alternate; }
        @keyframes pulse { to { transform: scale(1.08); } }

        /* ---------- HUD (puntaje y récord) ---------- */
        #hud {
            position: fixed; top: 16px; left: 16px;
            padding: 8px 18px; border-radius: 999px;
            background: rgba(0, 0, 0, 0.4);
            color: white; font-size: 1.2rem; font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        #hud b { color: var(--gold); }
    </style>

    <!-- El importmap SIEMPRE antes del script del módulo -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Puntaje y récord durante la partida -->
    <div id="hud" class="hidden">Puntaje: <b id="score">0</b> · Récord: <b id="best">0</b></div>

    <!-- Menú de niveles -->
    <div id="menu" class="screen">
        <h1 class="title">Jumping Animals</h1>
        <p class="subtitle">Elige un nivel</p>
        <div class="cards">
            <button class="card" data-level="1">
                <span class="icon">🐔</span>
                <span class="name">Nivel 1</span>
                <span class="desc">La carretera: esquiva carros y camiones</span>
                <span class="record">🏆 Récord: <b id="menuBest1">0</b></span>
            </button>
            <button class="card" data-level="2">
                <span class="icon">🐸</span>
                <span class="name">Nivel 2</span>
                <span class="desc">El río: salta de tronco en tronco</span>
                <span class="record">🏆 Récord: <b id="menuBest2">0</b></span>
            </button>
        </div>
        <div class="controls">
            <h2>CONTROLES</h2>
            <div class="control-row">
                <span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
                <span class="or">o</span>
                <span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span>
                <span class="label">Moverte (un paso por pulsación)</span>
            </div>
            <div class="control-row">
                <span class="keys"><kbd>Esc</kbd></span>
                <span class="label">Volver al menú</span>
            </div>
        </div>
    </div>

    <!-- Pantalla de Game over -->
    <div id="gameover" class="screen hidden">
        <div class="panel">
            <h1 class="title">¡Game over!</h1>
            <p id="finalScore"></p>
            <p id="recordMsg"></p>
            <button id="retry" class="btn">Jugar de nuevo</button>
            <button id="toMenu" class="btn secondary">Menú</button>
        </div>
        <p class="hint">Enter o Espacio para reintentar · Esc para el menú</p>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
